name: Inspect
on:
  workflow_dispatch:
  push:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build
        run: gradle assembleDebug --console=plain 2>&1 | tee build-log.txt
      - name: Inspect
        if: always()
        run: |
          {
            echo "=== SOURCE FILES ==="
            find . -path ./.git -prune -o -path ./app/build -prune -o -type f -print || true
            echo "=== APK CONTENT ==="
            unzip -l app/build/outputs/apk/debug/app-debug.apk || true
            echo "=== COMPILED ROOMX CLASSES ==="
            find app/build -name "*.class" | grep -i roomx || true
            echo "=== KOTLIN TASKS ==="
            grep -i "kotlin" build-log.txt || true
            echo "=== app/build.gradle.kts ==="
            cat app/build.gradle.kts || true
          } > inspect.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inspect
          path: inspect.txt
